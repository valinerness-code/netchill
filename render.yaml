registryCredential:
  fromRegistryCreds:
    name: azure-acr-keys # References the DOCKER key name saved in your dashboard settings

# 2. ISOLATED PRODUCTION SERVICES PROFILES
services:
  # Frontend Web Container Configuration
  - type: web
    name: netchill-frontend
    runtime: image
    plan: free
    image:
      url: netchillregistry.azurecr.io/netchill-frontend:latest # Starts directly with your Azure domain

  # Backend Web Container Configuration
  - type: web
    name: netchill-backend
    runtime: image
    plan: free
    image:
      url: netchillregistry.azurecr.io/netchill-backend:latest
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false