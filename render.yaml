services:
  # 1. Frontend Streamlit Web Service
  - type: web
    name: netchill-frontend
    runtime: image
    plan: free
    image:
      url: docker.io/netchillregistry.azurecr.io/netflix-frontend:latest
    envVars:
      - key: PORT
        value: "8501"

  # 2. Backend Java Web Service
  - type: web
    name: netchill-backend
    runtime: image
    plan: free
    image:
      url: docker.io/netchillregistry.azurecr.io/netflix-backend:latest
    envVars:
      - key: PORT
        value: "8080"
      # This tells Render to look for a secure secret variable in the UI dashboard instead of reading it from your code!
      - key: DATABASE_URL
        sync: false 