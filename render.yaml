services:
  - type: web
    name: netchill
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: netchill-db
          property: connectionString

databases:
  - name: netchill-db
    databaseName: netchill
    user: netchill
    plan: free
