services:
  # 1. Frontend Streamlit Web Service
  - type: web
    name: netchill-frontend
    runtime: image
    plan: free
    image:
      url: docker.io/netchillregistry.azurecr.io/netchill-frontend:latest
      # Connects this service directly to the credentials you saved in the dashboard
      creds:
        fromRegistryCreds:
          name: azure-acr-keys
    envVars:
      - key: PORT
        value: "8501"

  # 2. Backend Java Web Service
  - type: web
    name: netchill-backend
    runtime: image
    plan: free
    image:
      url: docker.io/netchillregistry.azurecr.io/netchill-backend:latest
      # Connects this service directly to the credentials you saved in the dashboard
      creds:
        fromRegistryCreds:
          name: azure-acr-keys
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false