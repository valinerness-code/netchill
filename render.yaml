services:
  # 1. Frontend Streamlit Web Service
  - type: web
    name: netchill-frontend
    runtime: image
    plan: free
    image:
      url: docker.io/netchillregistry.azurecr.io/netchill-frontend:latest
      registryCredentialId: azure-acr-keys
    envVars:
      - key: PORT
        value: "8501"

  # 2. Backend Java Web Service
  - type: web
    name: netchill-backend
    runtime: image
    plan: free
    image:
      url: docker.io/netchillregistry.azurecr.io/netchill-backend:latest
      registryCredentialId: azure-acr-keys
    envVars:
      - key: PORT
        value: "8080"
      # Keeps the database variable active, but tells Render to collect the link from the UI
      - key: DATABASE_URL
        sync: false

# 3. Securely hooks Render into your private Azure Container Registry
registryCredentials:
  - id: azure-acr-keys
    name: Azure ACR Credentials
    username:
      sync: false
    password:
      sync: false