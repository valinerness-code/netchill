services:
  # 1. Frontend Streamlit Web Service
  - type: web
    name: netchill-frontend
    runtime: image
    plan: free
    image:
      url: netchillregistry.azurecr.io/netchill-frontend:latest
      # Point directly to the credentials block matching Render specification rules
      registryCredentialId: azure-acr-keys
    envVars:
      - key: PORT
        value: "8501"

  # 2. Backend Java Web Service
  - type: web
    name: netchill-backend
    runtime: image
    plan: free
    image:
      url: netchillregistry.azurecr.io/netchill-backend:latest
      registryCredentialId: azure-acr-keys
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false # Safely prompts you inside Render for your Aiven URL string

# This must sit at the bottom level, spelled exactly as shown to create dashboard fields
registryCredentials:
  - id: azure-acr-keys
    name: azure-acr-keys
    username:
      sync: false
    password:
      sync: false