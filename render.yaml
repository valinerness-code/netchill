# Shared by both services so the frontend can prove its identity to the backend
# (lets the backend trust the end-user IP the frontend forwards for rate limiting).
# Render generates a random value once and gives the same value to both services.
envVarGroups:
  - name: netchill-shared
    envVars:
      - key: API_SHARED_SECRET
        generateValue: true

services:
  # 1. Frontend Streamlit Web Service
  - type: web
    name: netchill-frontend
    runtime: image
    plan: free
    image:
      # Render automatically links to your public Docker Hub repositories without any credentials!
      url: docker.io/valinerness/netchill-frontend:latest
    envVars:
      - fromGroup: netchill-shared
      - key: PORT
        value: "8501"
      - key: BACKEND_API_URL
        value: https://netchill-backend.onrender.com

  # 2. Backend Java Web Service
  - type: web
    name: netchill-backend
    runtime: image
    plan: free
    image:
      url: docker.io/valinerness/netchill-backend:latest
    envVars:
      - fromGroup: netchill-shared
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false