services:
  - type: web
    name: netchill
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: netchill-db
          property: connectionString
databases:
  - name: netchill-db
    databaseName: netchill
    user: netchill
    plan: free