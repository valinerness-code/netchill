<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Netchill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="home.css" />
    <style>
      :root {
        --page-bg: #050505;
        --page-panel: #111111;
        --page-line: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: #f5f5f5;
        font-family: "Inter", sans-serif;
      }

      button {
        font: inherit;
      }

      .netflix-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side-rail {
        background: rgba(14, 14, 14, 0.96);
        border-right: 1px solid var(--page-line);
        padding: 2rem 1.25rem;
      }

      .brand-mark {
        color: #e50914;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        margin-bottom: 2rem;
      }

      .side-nav {
        display: grid;
        gap: 0.65rem;
      }

      .side-link {
        display: block;
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.8);
        border-radius: 0.8rem;
        padding: 0.8rem 0.9rem;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .side-link:hover,
      .side-link.active {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.08);
      }

      .content-panel {
        padding: 2rem clamp(1.25rem, 4vw, 3rem);
      }

      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .page-title {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.06em;
      }

      .page-back {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 0.75rem 1rem;
        cursor: pointer;
      }

      .account-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        padding: 1.5rem;
      }

      .account-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .account-row:last-child {
        border-bottom: none;
      }

      .account-row span {
        color: #b5b5b5;
      }

      @media (max-width: 760px) {
        .netflix-shell {
          grid-template-columns: 1fr;
        }

        .side-rail {
          border-right: none;
          border-bottom: 1px solid var(--page-line);
        }

        .side-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="netflix-shell">
      <aside class="side-rail">
        <div class="brand-mark">NETCHILL</div>
        <nav class="side-nav" aria-label="Account navigation">
          <button class="side-link active" type="button">Account</button>
          <button class="side-link" type="button" onclick="window.location.href='manage-profiles.html'">Manage Profiles</button>
          <button class="side-link" type="button" onclick="window.location.href='help-center.html'">Help Center</button>
          <button class="side-link" type="button" onclick="window.location.href='home.html'">Back to Home</button>
        </nav>
      </aside>

      <main class="content-panel">
        <div class="top-row">
          <h1 class="page-title">Account</h1>
          <button class="page-back" type="button" onclick="window.location.href='home.html'">Back to Home</button>
        </div>

        <div class="account-card">
          <div class="account-row"><span>Membership</span><strong>Premium</strong></div>
          <div class="account-row"><span>Email</span><strong>alex@example.com</strong></div>
          <div class="account-row"><span>Plan</span><strong>4K + HDR</strong></div>
          <div class="account-row"><span>Playback</span><strong>Auto</strong></div>
          <div class="account-row"><span>Billing</span><strong>Visa •••• 2431</strong></div>
        </div>
      </main>
    </div>
  </body>
</html>
