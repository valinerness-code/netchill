name: CI/CD to Azure Container Registry

on:
  push:
    branches:
      - main # Triggers the pipeline every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================================================================
      # AZURE CONTAINER REGISTRY LOGIN NOTE:
      # You must add secrets to your GitHub repository settings under:
      # Settings -> Secrets and variables -> Actions -> New repository secret
      # Add: ACR_LOGIN_SERVER, ACR_USERNAME, and ACR_PASSWORD
      # =========================================================================
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }} # e.g., mynetflixregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build and push the Frontend (Streamlit) Container
      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/netflix-frontend:latest ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/netflix-frontend:latest

      # Build and push the Backend (Node.js) Container
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/netflix-backend:latest ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/netflix-backend:latest
