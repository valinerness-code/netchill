name: CI/CD to Azure Container Registry

on:
  push:
    branches:
      - main # Triggers the pipeline every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Logs into your private Azure server using your master admin keys
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Builds the frontend code and pushes the image to Azure
      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/netchill-frontend:latest ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/netchill-frontend:latest

      # Builds the backend Java code and pushes the image to Azure
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/netchill-backend:latest ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/netchill-backend:latest

      # Pings Render to look at Azure and update the website layout
      - name: Trigger Render Pull and Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"