name: CI/CD to Docker Hub

on:
  push:
    branches:
      - main # Triggers the pipeline every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Logs into Docker Hub using your username and your secure Personal Access Token
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds the frontend code and pushes the image to Docker Hub
      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netchill-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/netchill-frontend:latest

      # Builds the backend Java code and pushes the image to Docker Hub
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netchill-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/netchill-backend:latest