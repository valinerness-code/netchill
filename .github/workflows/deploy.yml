name: CI/CD to Docker Hub

on:
  push:
    branches:
      - main # Triggers the pipeline every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Check the code before building
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check frontend syntax and lint
        run: |
          pip install ruff
          python -m py_compile frontend/app.py
          ruff check frontend/app.py --select E9,F63,F7,F82

      # Logs into Docker Hub using your username and your secure Personal Access Token
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds the frontend code and pushes the image to Docker Hub
      # (also tagged with the commit ID so Render pulls the right version)
      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netchill-frontend:latest -t ${{ secrets.DOCKER_USERNAME }}/netchill-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/netchill-frontend --all-tags

      # Builds the backend Java code and pushes the image to Docker Hub
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netchill-backend:latest -t ${{ secrets.DOCKER_USERNAME }}/netchill-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/netchill-backend --all-tags

      # Tell Render to redeploy with the new images
      # --fail makes the run go red if Render rejects the request
      - name: Deploy Backend on Render
        run: |
          curl --fail -sS "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}&imgURL=docker.io%2F${{ secrets.DOCKER_USERNAME }}%2Fnetchill-backend%3A${{ github.sha }}"

      - name: Deploy Frontend on Render
        run: |
          curl --fail -sS "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}&imgURL=docker.io%2F${{ secrets.DOCKER_USERNAME }}%2Fnetchill-frontend%3A${{ github.sha }}"