<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Profiles | Netchill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="home.css" />
    <style>
      :root {
        --page-bg: #050505;
        --page-panel: #111111;
        --page-panel-soft: #171717;
        --page-line: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: #f5f5f5;
        font-family: "Inter", sans-serif;
      }

      button {
        font: inherit;
      }

      .netflix-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side-rail {
        background: rgba(14, 14, 14, 0.96);
        border-right: 1px solid var(--page-line);
        padding: 2rem 1.25rem;
      }

      .brand-mark {
        color: #e50914;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        margin-bottom: 2rem;
      }

      .side-nav {
        display: grid;
        gap: 0.65rem;
      }

      .side-link {
        display: block;
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.8);
        border-radius: 0.8rem;
        padding: 0.8rem 0.9rem;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .side-link:hover,
      .side-link.active {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.08);
      }

      .content-panel {
        padding: 2rem clamp(1.25rem, 4vw, 3rem);
      }

      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .page-title {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.06em;
      }

      .page-back {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 0.75rem 1rem;
        cursor: pointer;
      }

      .profile-grid-page {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 1.2rem;
      }

      .page-profile-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        padding: 1.2rem 0.8rem;
        text-align: center;
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .page-profile-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.18);
      }

      .page-profile-avatar {
        width: 5rem;
        height: 5rem;
        display: grid;
        place-items: center;
        margin: 0 auto 0.9rem;
        border-radius: 50%;
        font-size: 1.3rem;
        font-weight: 800;
        color: #111;
      }

      .amber { background: linear-gradient(135deg, #f8d488, #f59e0b); }
      .pink { background: linear-gradient(135deg, #f9a8d4, #ec4899); }
      .blue { background: linear-gradient(135deg, #93c5fd, #2563eb); }

      @media (max-width: 760px) {
        .netflix-shell {
          grid-template-columns: 1fr;
        }

        .side-rail {
          border-right: none;
          border-bottom: 1px solid var(--page-line);
        }

        .side-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="netflix-shell">
      <aside class="side-rail">
        <div class="brand-mark">NETCHILL</div>
        <nav class="side-nav" aria-label="Account navigation">
          <button class="side-link" type="button" onclick="window.location.href='account.html'">Account</button>
          <button class="side-link active" type="button">Manage Profiles</button>
          <button class="side-link" type="button" onclick="window.location.href='help-center.html'">Help Center</button>
          <button class="side-link" type="button" onclick="window.location.href='home.html'">Back to Home</button>
        </nav>
      </aside>

      <main class="content-panel">
        <div class="top-row">
          <h1 class="page-title">Manage Profiles</h1>
          <button class="page-back" type="button" onclick="window.location.href='home.html'">Back to Home</button>
        </div>

        <div class="profile-grid-page">
          <button class="page-profile-card" type="button">
            <div class="page-profile-avatar amber">A</div>
            <strong>Alex</strong>
          </button>

          <button class="page-profile-card" type="button">
            <div class="page-profile-avatar pink">M</div>
            <strong>Mia</strong>
          </button>

          <button class="page-profile-card" type="button">
            <div class="page-profile-avatar blue">K</div>
            <strong>Kids</strong>
          </button>

          <button class="page-profile-card" type="button">
            <div class="page-profile-avatar" style="background: linear-gradient(135deg, #d4d4d4, #8b8b8b);">+</div>
            <strong>Add Profile</strong>
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
